<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Pandemic - Jogo</title>
    <link rel="stylesheet" href="css/jogo.css" />
  </head>
  <body>
    <div id="appVue" v-cloak>
      <div class="mesa">
        <div id="info" :style="{ backgroundColor: jogadorAtivo.peao?.cor || 'gray' }">Jogador: {{ jogadorAtivo.nome }}</div>
        <div class="conteiner-doenca">
          <div>
            <div v-if="controls.mostrarCartasInfeccao">
              <div style="display: inline-flex; gap: 8px">
                <div v-for="(cartaInfeccao, index) in cartasInfeccao.monteDescarte" :key="index">
                  <carta-infeccao :cidade="cartaInfeccao.cidade" :cor="cartaInfeccao.cor" />
                </div>
              </div>
            </div>
            <button @click="controls.mostrarCartasInfeccao = !controls.mostrarCartasInfeccao">Montinho das cartas de doença usadas</button>
          </div>
          <div class="caixinha-doenca" v-for="doenca in doencas" :style="{ backgroundColor: doenca.cor }" :key="doenca.cor">
            <div v-for="(cubo, index) in doenca.cubosDoenca" v-if="cubo.posicao === 'caixa'" :key="index">
              <pino-doenca :cor="doenca.cor"></pino-doenca>
            </div>
          </div>
          <div class="caixinha-centroPesquisa">
            <div v-for="(centroPesquisa, index) in centrosPesquisa" v-if="centroPesquisa.posicao === 'caixa'" :key="index">
              <centro-pesquisa></centro-pesquisa>
            </div>
          </div>
          <div style="display: flex">
            <div v-for="doenca in doencas" :key="doenca.cor">
              <marcador-cura :cor="doenca.cor" :estado="doenca.estado"></marcador-cura>
            </div>
          </div>
        </div>
        <div class="board">
          <svg id="conexoes-svg" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0">
            <line v-for="(conexao, index) in conexoesCidades" :key="index" :x1="getCidadeX(conexao.from)" :y1="getCidadeY(conexao.from)" :x2="getCidadeX(conexao.to)" :y2="getCidadeY(conexao.to)" stroke="#999" stroke-width="2" />
          </svg>
          <div v-for="cidade in cidades" :id="'cidade-' + cidade.id" class="city" :style="{ ...EstilizarObjetoPosicao(cidade), backgroundColor: cidade.cor }" @click="jogadorAtivoAcao(cidade)">
            <!-- Pinos de Jogador -->{{cidade.nome}}
            <div v-for="jogador in jogadores.filter(j => j.peao.lugar === cidade.nome)">
              <pino-jogador :cor="jogador.peao.cor"></pino-jogador>
            </div>

            <!-- Pinos de Doença -->
            <div v-for="(doenca, index) in doencas" :key="index">
              <div v-for="(cubo, idx) in doenca.cubosDoenca" v-if="cubo.posicao === cidade.nome" :key="idx">
                <pino-doenca :cor="doenca.cor"></pino-doenca>
              </div>
            </div>

            <!-- Centro de Pesquisa -->
            <div v-for="centro in centrosPesquisa" v-if="centro.posicao === cidade.nome" :key="centro.posicao">
              <centro-pesquisa></centro-pesquisa>
            </div>
          </div>
          <div v-for="espaco in espacosMarcadorInfeccao" :key="espaco.id" :style="EstilizarObjetoPosicao(espaco)">
            <marcador-infeccao :atual="espaco.atual" :nivel="espaco.nome"></marcador-infeccao>
          </div>
          <div v-for="espaco in espacosMarcadorSurto" :key="espaco.id" class="marcadorSurtos" :atual="espaco.atual" :nivel="espaco.nome" :style="EstilizarObjetoPosicao(espaco)">
            <marcador-surto :atual="espaco.atual" :nivel="espaco.nome"></marcador-surto>
          </div>
        </div>
        <div class="acoes">
          Ao marcar a ação você estará apto a realizar ela (Ações restantes: {{ acoesRestantes }})
          <select v-model="acaoAtual">
            <option value="">Selecione Sua Próxima Ação</option>
            <option v-for="acao in acoes" :key="acao" :value="acao">{{ acao }}</option>
          </select>
        </div>
        <div class="conteiner-cartas-jogador">
          <div v-if="controls.mostrarCartaReferencia">
            <carta-referencia></carta-referencia>
          </div>
          <div v-if="controls.mostrarCartasJogador" style="display: flex">
            <carta-personagem :nome="jogadorAtivo.nome" :funcao="jogadorAtivo.cartaPersonagem.funcao" :imagem="jogadorAtivo.cartaPersonagem.imagem" :habilidades="jogadorAtivo.cartaPersonagem.habilidades"></carta-personagem>
            <div v-for="carta in jogadorAtivo.cartas">
              <carta-jogo :tipo="carta.tipo" :conteudo="carta.conteudo" :descricao="carta.descricao" :style="{ backgroundColor: carta.tipo === 'cidade' ? carta.descricao : '#fff' }"></carta-jogo>
            </div>
          </div>
          <div style="display: flex">
            <button style="margin-right: 2rem" v-model="controls.mostrarCartaReferencia" @click="controls.mostrarCartaReferencia = !controls.mostrarCartaReferencia">Carta Referência</button>
            <button style="margin-right: 2rem" v-model="controls.mostrarCartasJogador" @click="controls.mostrarCartasJogador =!controls.mostrarCartasJogador">Cartas Jogáveis</button>
            <p><a href="instrucao.html" target="_blank">Instrução</a></p>
          </div>
        </div>
      </div>
      <div v-if="modal.mostra">
        <div class="modal-overlay" @click.self="modal.mostra = false">
          <div class="modal-content">
            <button class="fechar" @click="modal.mostra = false">✖</button>
            <p>{{ modal.mensagem }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Vue 2 -->
    <script src="assets/vue.js"></script>

    <!-- Componentes -->
    <script src="components/CartaInfeccao.js"></script>
    <script src="components/CartaJogo.js"></script>
    <script src="components/CartaPersonagem.js"></script>
    <script src="components/CartaReferencia.js"></script>
    <script src="components/CentroPesquisa.js"></script>
    <script src="components/CuboDoenca.js"></script>
    <script src="components/MarcadorCura.js"></script>
    <script src="components/MarcadorSurto.js"></script>
    <script src="components/MarcadorVelocidadeInfeccao.js"></script>
    <script src="components/Peao.js"></script>

    <!-- App principal -->
    <script type="module" src="jogo.js"></script>
  </body>
</html>
